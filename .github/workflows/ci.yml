name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check.js
      - run: node scripts/test.js test/unit
      - run: node scripts/test.js test/integration/mcp-stdio.test.js test/integration/native-backends.test.js

  gui-linux:
    name: GUI integration (Linux X11 under Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop automation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xterm xdotool wmctrl x11-utils imagemagick xclip tesseract-ocr
      - run: node scripts/test.js test/integration
